name: Build Docs APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unpack and build
        run: |
          unzip -q Mellow-Docs-project.zip
          cd mellow-docs
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Mellow-Docs.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: docs-${{ github.run_number }}
          name: Mellow Docs build ${{ github.run_number }}
          files: Mellow-Docs.apk
